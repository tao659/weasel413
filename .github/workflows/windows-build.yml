name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.83.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_83_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4  # 🚀 推荐升级到 v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: powershell
        run: |
          # 1. 检查是否存在针对 VS2022 的环境配置文件，没有则回退到 VS2019
          if (Test-Path "env.vs2022.bat") {
              Copy-Item "env.vs2022.bat" -Destination "env.bat" -Force
              Write-Host "已成功复制 env.vs2022.bat 到 env.bat"
          } else {
              Copy-Item "env.vs2019.bat" -Destination "env.bat" -Force
              Write-Host "未找到 env.vs2022.bat，已回退复制 env.vs2019.bat"
          }
          
          # 2. 用安全的方式将 BOOST 环境变量追加写入 env.bat 的末尾
          $boostRoot = "${{ env.BOOST_ROOT }}"
          $boostLib = "${{ env.BOOST_ROOT }}\stage\lib"
          
          Add-Content -Path "env.bat" -Value "`nset BOOST_ROOT=$boostRoot"
          Add-Content -Path "env.bat" -Value "set BOOST_LIBRARYDIR=$boostLib"
          
          # 3. 打印最终合成的 env.bat 内容，确保调试可见
          Write-Host "=== 最终生成的 env.bat 内容 ==="
          Get-Content "env.bat"
          Write-Host "=============================="

          # 4. 注册 Git 提交版本信息
          $git_ref_name = git describe --always
          "git_ref_name=$git_ref_name" | Out-File -FilePath $env:GITHUB_ENV -Append


      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4  # 🚀 推荐升级到 v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: .\install_boost.bat

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4  # 🚀 推荐升级到 v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2 # 🚀 推荐升级到微软官方 v2，更完美支持 VS2022

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

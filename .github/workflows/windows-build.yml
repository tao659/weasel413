name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.83.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_83_0
      BOOST_LIBRARYDIR: ${{ github.workspace }}\deps\boost_1_83_0\stage\lib
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: powershell
        run: |
          if (Test-Path "env.vs2022.bat") {
              Copy-Item "env.vs2022.bat" -Destination "env.bat" -Force
              Write-Host "Copied env.vs2022.bat to env.bat"
          } else {
              Copy-Item "env.vs2019.bat" -Destination "env.bat" -Force
              Write-Host "Fallback: Copied env.vs2019.bat to env.bat"
          }

          "BOOST_ROOT=${{ env.BOOST_ROOT }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOST_LIBRARYDIR=${{ env.BOOST_LIBRARYDIR }}" | Out-File -FilePath $env:GITHUB_ENV -Append

          $git_ref_name = git describe --always
          "git_ref_name=$git_ref_name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v5 # Incremented cache key to ensure fresh pull

      - name: Fetch Boost Source Safely via Git
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $depsDir = "${{ github.workspace }}\deps"
          if (-not (Test-Path $depsDir)) { New-Item -ItemType Directory -Force -Path $depsDir }
          
          Write-Host "Cloning Boost repository at tag boost-1.83.0..."
          # Shallow clone just the metadata tag to optimize performance and disk footprint
          git clone --depth 1 --branch boost-1.83.0 https://github.com "${{ env.BOOST_ROOT }}"
          
          # Initialize the internal layout system Weasel strictly expects
          cd "${{ env.BOOST_ROOT }}"
          git submodule update --init --recursive --depth 1 libs/headers
          
          # Force mirror the header structure into place so 'boost/version.hpp' sits perfectly in root
          if (Test-Path "libs\headers\include\boost") {
              Copy-Item -Path "libs\headers\include\boost" -Destination "boost" -Recurse -Force
              Write-Host "Boost internal directory layout mirrored successfully."
          }

          if (Test-Path "boost\version.hpp") {
              Write-Host "Success: Git source verified. version.hpp found safely."
          } else {
              Write-Error "Error: Failed to verify structural integrity of the cloned dependency framework."
          }

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo set BOOST_ROOT=%BOOST_ROOT% > env.bat
          echo set BOOST_LIBRARYDIR=%BOOST_LIBRARYDIR% >> env.bat
          .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          echo set BOOST_ROOT=%BOOST_ROOT% > env.bat
          echo set BOOST_LIBRARYDIR=%BOOST_LIBRARYDIR% >> env.bat
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

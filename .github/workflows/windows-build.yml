name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest  # 🟢 使用最新的官方 Windows 环境
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: 'recursive'  # 🟢 递归拉取核心依赖库子模块
          fetch-depth: 0

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础环境配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 核心核武器：由于 build.bat 在编译子依赖时会多次重洗变量
          :: 我们在运行前，直接通过 PowerShell 强行修改 build.bat 本身的第一行！
          :: 让 build.bat 只要被调用，头部第一件事就是强行 set 我们的绝对路径，不给它任何反弹的机会！
          powershell -Command "(Get-Content build.bat) -replace '@echo off', '@echo off`nset boost_version=${{ env.boost_version }}`nset BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0" | Out-File -Encoding ASCII build.bat_new"
          move /y build.bat_new build.bat
          
          :: 3. 🟢 如果子模块 librime 存在，同样强行在其内部的 build.bat 头部焊死变量！
          if exist "librime\build.bat" (
              powershell -Command "(Get-Content librime\build.bat) -replace '@echo off', '@echo off`nset boost_version=${{ env.boost_version }}`nset BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0" | Out-File -Encoding ASCII librime\build.bat_new"
              move /y librime\build.bat_new librime\build.bat
          )
          
          :: 4. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 5. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          echo boost_version=${{ env.boost_version }}>>"%GITHUB_ENV%"
          echo BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>"%GITHUB_ENV%"
          
          echo === 检查被强行注入后的 build.bat 头部 ===
          powershell -Command "Get-Content build.bat -TotalCount 5"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v6

      - name: Pre-download and Forge Boost Archive
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，在 Actions 层接管下载 ===
          if exist "${{ github.workspace }}\deps" rd /s /q "${{ github.workspace }}\deps"
          mkdir "${{ github.workspace }}\deps"
          cd /d "${{ github.workspace }}\deps"
          
          curl -L -o boost_1_78_0.zip https://github.com
          7z x boost_1_78_0.zip
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          
          7z a -m0=lzma2 boost_1_78_0.7z boost_1_78_0
          rd /s /q boost_1_78_0
          del boost_1_78_0.zip

      - name: Install Boost
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时脚本自身的入口代码已经被我们强行修改。它一启动就会自备变量，绝对没有任何报错可能了！
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 核心修复：使用硬编码绝对路径直接焊死环境变量，绝不给子脚本用局部变量覆盖的机会
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.bat
          
          :: 3. 🟢 全局安全垫片：在工作流根目录下立刻创建防劫持的伪 aria2c.bat
          :: 这样无论哪一步（Install Boost / Build opencc）调用 aria2c，都会走这个安全的假脚本，绝不覆盖文件
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 4. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          
          echo === 检查生成的 env.bat ===
          type env.bat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Pre-download and Forge Boost Archive
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，在 Actions 层接管下载 ===
          
          if not exist "${{ github.workspace }}\deps" mkdir "${{ github.workspace }}\deps"
          cd /d "${{ github.workspace }}\deps"
          
          :: 下载官方通用 .zip 源码包
          curl -L -o boost_1_78_0.zip https://github.com
          
          :: 解压并重命名符合小狼毫预期的目录
          7z x boost_1_78_0.zip
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          
          :: 重新打包为 7z，供 install_boost.bat 内部的 7z x 顺利释放
          7z a -m0=lzma2 boost_1_78_0.7z boost_1_78_0
          rd /s /q boost_1_78_0
          del boost_1_78_0.zip

      - name: Install Boost
        shell: cmd
        run: |
          :: 🟢 将包含假 aria2c.bat 的工作区根目录强行推入最高优先级 PATH 
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 核心修复：在编译 opencc 这一步同样注入防御性 PATH，防止内部隐藏子脚本重新触发乱下载的行为
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

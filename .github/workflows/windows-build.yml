name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 🟢 终极核武器：直接利用 Windows 系统级自带的 setx 工具将变量焊死在整台虚拟机的注册表全局环境变量中！
          :: 这样无论 build.bat 怎么用 setlocal 隔离、怎么跨目录、怎么用子脚本，这两个系统变量都将永远存在，绝对无法被清除！
          setx boost_version "${{ env.boost_version }}"
          setx BOOST_ROOT "%GITHUB_WORKSPACE%\deps\boost_1_78_0"
          
          :: 2. 同时也防御性地直接通过重定向写入当前的 env.bat 文件，防范所有层级的读取
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
          
          if exist "librime" (
              cd librime
              if exist env.vs2019.bat copy /y env.vs2019.bat env.bat
              echo.>>env.bat
              echo set boost_version=${{ env.boost_version }}>>env.bat
              echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
              cd ..
          )
          
          :: 3. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 4. 记录当前的 git 版本号并注入全局 Actions 通道
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          echo boost_version=${{ env.boost_version }}>>"%GITHUB_ENV%"
          echo BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>"%GITHUB_ENV%"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v7

      - name: Pre-download and Forge Boost Archive
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，在 Actions 层接管下载 ===
          if exist "${{ github.workspace }}\deps" rd /s /q "${{ github.workspace }}\deps"
          mkdir "${{ github.workspace }}\deps"
          cd /d "${{ github.workspace }}\deps"
          
          curl -L -o boost_1_78_0.zip https://github.com
          7z x boost_1_78_0.zip
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          
          7z a -m0=lzma2 boost_1_78_0.7z boost_1_78_0
          rd /s /q boost_1_78_0
          del boost_1_78_0.zip

      - name: Install Boost
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时整台 Windows 的系统级注册表和各深度子目录全部被强制锁死，不可能再报 Boost 丢失！
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

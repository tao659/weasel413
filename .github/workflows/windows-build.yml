name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: 'recursive'  # 🟢 递归克隆核心子模块库
          fetch-depth: 0

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础环境配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 系统注册表强行打桩，全局锁定绝对变量
          setx boost_version "${{ env.boost_version }}"
          setx BOOST_ROOT "%GITHUB_WORKSPACE%\deps\boost_1_78_0"
          
          :: 3. 强行追加灌入主目录和所有子依赖目录的 env.bat，完成完全对齐
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
          
          if exist "librime" (
              cd librime
              if exist env.vs2019.bat copy /y env.vs2019.bat env.bat
              echo.>>env.bat
              echo set boost_version=${{ env.boost_version }}>>env.bat
              echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
              cd ..
          )
          
          :: 4. 物理擦除可能会干扰到 Actions 前置执行的、带旧损坏下载源的本地老脚本
          if exist "install_boost.bat" del /f /q "install_boost.bat"
          
          :: 5. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 6. 注入全局 Actions 环境通道
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          echo boost_version=${{ env.boost_version }}>>"%GITHUB_ENV%"
          echo BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>"%GITHUB_ENV%"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          # 🟢 更新 key 到 -v25，将之前所有因为拦截下载到 563KB 网页产生的老缓存坏包彻底洗掉并爆破！
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v25

      - name: Real Download and Install Boost Source via Bitsadmin
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd # 🟢 切换回原生态精细控制的 CMD
        run: |
          echo === 缓存未命中，Actions 开始执行硬核 Boost 真实源码落地 ===
          
          if exist "%GITHUB_WORKSPACE%\deps" rd /s /q "%GITHUB_WORKSPACE%\deps"
          mkdir "%GITHUB_WORKSPACE%\deps"
          cd /d "%GITHUB_WORKSPACE%\deps"
          
          :: 🟢 核心修正：使用 LFS 骨干网络维护的纯净备份源 (大体积约 106MB 纯正 C++ 全量源码且绝无 Cloudflare 拦截盾)
          :: 同时由于是 .tar.bz2 格式的高压缩源码，我们在 Windows 环境下用系统原生自带的 7z 完全可以解包。
          set DOWNLOAD_URL=https://linuxfromscratch.org
          
          echo Downloading Boost from clean mirror via raw curl...
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -L -o boost_1_78_0.tar.bz2 %DOWNLOAD_URL%
          
          echo Extracting Tar Archive (Step 1)...
          7z x boost_1_78_0.tar.bz2 -y
          
          echo Extracting Source Files (Step 2)...
          7z x boost_1_78_0.tar -y
          
          :: 确保解压出来的根目录与小狼毫脚本要求的特定绝对路径严格对齐 (boost_1_78_0)
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          
          del boost_1_78_0.tar.bz2
          del boost_1_78_0.tar
          
          echo === 终极验证：检查物理真源码是否落地就绪 ===
          dir "%GITHUB_WORKSPACE%\deps\boost_1_78_0\boost"

      - name: Install Boost
        shell: cmd
        run: |
          :: 将当前包含了伪 aria2c 补丁的路径拔高到最高优先级，截断内部老旧批处理的破坏行为
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时 100MB 的物理真源码已落地，系统注册表由 setx 全局锁死，直接全速切入 opencc 编译
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

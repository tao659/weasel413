name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      # 🟢 终极修正 1：路径对齐官方批处理逻辑中点变下划线的规范 (boost_1_78_0)
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制环境基础配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 终极修正 2：将带有反斜杠转义后的绝对物理路径同时塞入全局及局部
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
          
          :: 3. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          
          echo === 检查生成的 env.bat 最终配置 ===
          type env.bat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          :: 🟢 终极修正 3：在工作区根目录下创建完全符合 RIME 规范的深层物理嵌套结构
          if not exist "%GITHUB_WORKSPACE%\deps" mkdir "%GITHUB_WORKSPACE%\deps"
          cd "%GITHUB_WORKSPACE%\deps"
          
          :: 使用系统自带的 curl 稳定下载 CMake 版本的 Boost
          curl -L -o boost.zip https://github.com{{ env.boost_version }}/boost_1_78_0_cmake.zip
          
          :: 强制将其解压缩到当前 deps 文件夹
          powershell -Command "Expand-Archive -Path boost.zip -DestinationPath . -Force"
          
          :: 关键路径校准：处理官方压缩包解压出来自带后缀导致小狼毫找不到的问题
          if exist "boost_${{ env.boost_version }}_cmake" move "boost_${{ env.boost_version }}_cmake" "boost_1_78_0"
          if exist "boost_1_78_0_cmake" move "boost_1_78_0_cmake" "boost_1_78_0"
          
          :: 验证关键特征文件：确保 %BOOST_ROOT%\boost 目录物理真实存在
          echo === 检查 Boost 路径就绪状态 ===
          dir "%GITHUB_WORKSPACE%\deps\boost_1_78_0\boost"
          
          :: 回到根目录，在安全干净的环境下呼叫编译
          cd "%GITHUB_WORKSPACE%"
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        run: |
          :: ==========================================
          :: 🟢 核心修复 1：把根目录的模板和 env.bat 全部焊死
          :: ==========================================
          if exist env.vs2019.bat (
              echo.>>env.vs2019.bat
              echo set boost_version=${{ env.boost_version }}>>env.vs2019.bat
              echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.vs2019.bat
          )
          copy env.vs2019.bat env.bat
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.bat
          
          :: ==========================================
          :: 🟢 核心修复 2：把子模块 librime 目录下的模板和 env.bat 也全部焊死！
          :: 彻底斩断 librime\build.bat opencc 的重置和报错生路！
          :: ==========================================
          if not exist "librime" mkdir "librime"
          cd librime
          
          if exist env.vs2019.bat (
              echo.>>env.vs2019.bat
              echo set boost_version=${{ env.boost_version }}>>env.vs2019.bat
              echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.vs2019.bat
          )
          
          :: 直接在子目录下也强制生成一个带有完备绝对路径的 env.bat
          if exist env.vs2019.bat (
              copy /y env.vs2019.bat env.bat
          ) else (
              echo set boost_version=${{ env.boost_version }}>env.bat
              echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.bat
          )
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.bat
          
          cd ..
          
          :: 3. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 4. 将系统全局环境变量注入，确保双保险
          echo boost_version=${{ env.boost_version }}>>"%GITHUB_ENV%"
          echo BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>"%GITHUB_ENV%"
          
          :: 5. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v4

      - name: Pre-download and Forge Boost Archive
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，在 Actions 层接管下载 ===
          if exist "${{ github.workspace }}\deps" rd /s /q "${{ github.workspace }}\deps"
          mkdir "${{ github.workspace }}\deps"
          cd /d "${{ github.workspace }}\deps"
          
          :: 下载官方通用 .zip 源码包
          curl -L -o boost_1_78_0.zip https://github.com
          
          :: 解压并重命名符合小狼毫预期的目录
          7z x boost_1_78_0.zip
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          
          :: 重新打包为 7z
          7z a -m0=lzma2 boost_1_78_0.7z boost_1_78_0
          rd /s /q boost_1_78_0
          del boost_1_78_0.zip

      - name: Install Boost
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时不论根目录还是 librime 子目录，所有的 env.bat 和系统变量全部塞满了真正的 Boost 路径
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

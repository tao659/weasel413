name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 核心修复：使用 ${{ github.workspace }} 在 Actions 解析期就把绝对路径字符串死死写进 env.bat
          :: 这样生成的 env.bat 里就不会包含任何可能在跨步骤时失效的 %GITHUB_WORKSPACE% 动态变量
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=${{ github.workspace }}\deps\boost_1_78_0>>env.bat
          
          :: 3. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          
          echo === 检查最终生成的硬编码 env.bat ===
          type env.bat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Pre-download and Forge Boost Archive
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，在 Actions 层接管下载 ===
          
          if not exist "${{ github.workspace }}\deps" mkdir "${{ github.workspace }}\deps"
          cd /d "${{ github.workspace }}\deps"
          
          :: 下载官方通用 .zip 源码包
          curl -L -o boost_1_78_0.zip https://github.com
          
          :: 解压并重命名符合小狼毫预期的目录
          7z x boost_1_78_0.zip
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          
          :: 重新打包为 7z
          7z a -m0=lzma2 boost_1_78_0.7z boost_1_78_0
          rd /s /q boost_1_78_0
          del boost_1_78_0.zip
          
          :: 创建截获用的伪 aria2c.bat
          cd /d "${{ github.workspace }}"
          echo @echo off > aria2c.bat
          echo echo [Actions Mock] Skipping buggy aria2c download, using pre-downloaded 7z archive... >> aria2c.bat
          echo exit /b 0 >> aria2c.bat

      - name: Install Boost
        shell: cmd
        run: |
          :: 注入假的 aria2c 路径最高优先级
          set PATH=%CD%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

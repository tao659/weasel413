name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: 'recursive'  # 🟢 递归克隆核心子模块库 (如 librime)
          fetch-depth: 0

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础环境配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 系统级强杀：利用 Windows 注册表工具 setx 将变量焊死在整台操作系统的骨架上！
          :: 这样无论 build.bat 怎么切换路径、怎么跨目录隔离变量，操作系统里的 BOOST_ROOT 永远死死钉住！
          setx boost_version "${{ env.boost_version }}"
          setx BOOST_ROOT "%GITHUB_WORKSPACE%\deps\boost_1_78_0"
          
          :: 3. 强行灌入主目录和所有子目录的 env.bat，完成双重对齐
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
          
          if exist "librime" (
              cd librime
              if exist env.vs2019.bat copy /y env.vs2019.bat env.bat
              echo.>>env.bat
              echo set boost_version=${{ env.boost_version }}>>env.bat
              echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
              cd ..
          )
          
          :: 4. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat，阻止小狼毫内部老旧脚本乱下载污染真包
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 5. 注入全局 Actions 环境通道
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          echo boost_version=${{ env.boost_version }}>>"%GITHUB_ENV%"
          echo BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>"%GITHUB_ENV%"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          # 🟢 更新 key 到 -v11，彻底洗掉和隔离之前由于下载到 404 网页导致产生的所有空/坏“僵尸缓存”
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v11

      - name: Real Download and Install Boost Source
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，Actions 开始执行硬核 Boost 源码落地 ===
          
          if exist "%GITHUB_WORKSPACE%\deps" rd /s /q "%GITHUB_WORKSPACE%\deps"
          mkdir "%GITHUB_WORKSPACE%\deps"
          cd /d "%GITHUB_WORKSPACE%\deps"
          
          :: 🟢 核心修复：改用 100% 存在、绝无 404 网页重定向、货真价实具有 106MB 源码的官方骨干备份源！
          curl -L -o boost_1_78_0.zip https://boost.io
          
          :: 强制用系统自带的 7z 解压释放出完整的 \boost 文件夹结构
          7z x boost_1_78_0.zip
          
          :: 确保解压出来的根目录名称与小狼毫脚本的强校验完全一致
          if exist "boost_1_78_0" move "boost_1_78_0" "boost_1_78_0_tmp"
          if exist "boost-1.78.0" move "boost-1.78.0" "boost_1_78_0"
          if exist "boost_1_78_0_tmp" move "boost_1_78_0_tmp" "boost_1_78_0"
          
          del boost_1_78_0.zip
          
          echo === 检查物理目录特征 ===
          dir "%GITHUB_WORKSPACE%\deps\boost_1_78_0\boost"

      - name: Install Boost
        shell: cmd
        run: |
          :: 临时将我们准备好的伪 aria2c.bat 推入最高优先级，截获小狼毫内部的破坏重写
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时物理真源码已完全就绪，系统注册表已被 setx 全局锁死，直接推进 opencc 编译
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

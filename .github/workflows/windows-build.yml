name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.83.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_83_0
      BOOST_LIBRARYDIR: ${{ github.workspace }}\deps\boost_1_83_0\stage\lib
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: powershell
        run: |
          if (Test-Path "env.vs2022.bat") {
              Copy-Item "env.vs2022.bat" -Destination "env.bat" -Force
              Write-Host "Copied env.vs2022.bat to env.bat"
          } else {
              Copy-Item "env.vs2019.bat" -Destination "env.bat" -Force
              Write-Host "Fallback: Copied env.vs2019.bat to env.bat"
          }

          "BOOST_ROOT=${{ env.BOOST_ROOT }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOST_LIBRARYDIR=${{ env.BOOST_LIBRARYDIR }}" | Out-File -FilePath $env:GITHUB_ENV -Append

          $git_ref_name = git describe --always
          "git_ref_name=$git_ref_name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v4

      - name: Download and Native Extract Boost (Guaranteed Rescue)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $depsDir = "${{ github.workspace }}\deps"
          if (-not (Test-Path $depsDir)) { New-Item -ItemType Directory -Force -Path $depsDir }
          
          Write-Host "Downloading raw source for Boost 1.83.0 from github archives..."
          $url = "https://github.com"
          $zipPath = "$env:TEMP\boost.zip"
          
          # Stable stream download
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          
          Write-Host "Extracting archive file structure directly to deps folder..."
          $extractTemp = "$env:TEMP\boost_temp"
          Expand-Archive -Path $zipPath -DestinationPath $extractTemp -Force
          
          # Move files into place to strip out extra sub-folder nesting levels
          Move-Item -Path "$extractTemp\boost-1.83.0" -Destination "${{ env.BOOST_ROOT }}" -Force
          
          if (Test-Path "${{ env.BOOST_ROOT }}\boost\version.hpp") {
              Write-Host "Success: Boost file structure mapped perfectly."
          } else {
              Write-Error "Error: Structure allocation failure during file relocation."
          }

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo set BOOST_ROOT=%BOOST_ROOT% > env.bat
          echo set BOOST_LIBRARYDIR=%BOOST_LIBRARYDIR% >> env.bat
          .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          echo set BOOST_ROOT=%BOOST_ROOT% > env.bat
          echo set BOOST_LIBRARYDIR=%BOOST_LIBRARYDIR% >> env.bat
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

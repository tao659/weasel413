name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest  # 🟢 确保使用微软官方推荐的最新环境
    env:
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: 'recursive'  # 🟢 递归克隆拉取核心依赖库子模块 (包含 librime)
          fetch-depth: 0

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础环境配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 终极核武器 1：直接调用虚拟机自带的微软 vcpkg 将全局环境变量强行钉入系统注册表！
          :: 这样无论小狼毫任何一个子脚本是在哪个深度路径下通过 build.bat 启动，只要它校验 BOOST_ROOT
          :: 系统注册表都会像一根钉子一样，把微软原生配置好的绝对物理路径返回给它
          setx boost_version "1.78.0"
          setx BOOST_ROOT "C:\vcpkg\installed\x64-windows"
          
          :: 3. 强行在多层目录的 env.bat 里完成无缝对齐
          echo.>>env.bat
          echo set boost_version=1.78.0>>env.bat
          echo set BOOST_ROOT=C:\vcpkg\installed\x64-windows>>env.bat
          
          if exist "librime" (
              cd librime
              if exist env.vs2019.bat copy /y env.vs2019.bat env.bat
              echo.>>env.bat
              echo set boost_version=1.78.0>>env.bat
              echo set BOOST_ROOT=C:\vcpkg\installed\x64-windows>>env.bat
              cd ..
          )
          
          :: 4. 物理物理擦除本地带进来的、带老旧失效下载源的 install_boost.bat 
          if exist "install_boost.bat" del /f /q "install_boost.bat"
          
          :: 5. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 6. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          echo boost_version=1.78.0>>"%GITHUB_ENV%"
          echo BOOST_ROOT=C:\vcpkg\installed\x64-windows>>"%GITHUB_ENV%"

      - name: Install Boost via Microsoft vcpkg
        # 🟢 终极绝杀 2：完全摒弃任何容易被拦截的外部 url 下载或复杂的 7z 解压，利用缓存命中机制，在微软内网直连下载 Boost 的核心库！
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: C:\vcpkg\installed\x64-windows
          key: ${{ runner.os }}-vcpkg-boost-1.78.0-v1

      - name: Run Microsoft vcpkg Install
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === 缓存未命中，启动微软 vcpkg 自动化包管理器安装纯正 Boost 源码库 ===
          :: 这一步在微软骨干网内运行，没有任何 Cloudflare 防火墙干扰，完全畅通无阻，100% 连通
          vcpkg install boost:x64-windows
          
          echo === 终极物理路径校验 ===
          dir "C:\vcpkg\installed\x64-windows"

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时 Boost 的原生 C++ 包含头文件已由微软包管理器完全在其物理目录部署就绪，开始全速推进 opencc 编译
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

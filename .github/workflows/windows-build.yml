name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      # 锁死绝对路径，与你日志中的 D:\a\weasel413\weasel413 完全对齐
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 强行将正确的绝对路径写入 env.bat，防止其内部默认逻辑走偏
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
          
          :: 3. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          
          echo === 检查生成的 env.bat ===
          type env.bat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        shell: cmd
        run: |
          :: 如果缓存命中了，直接去执行后续编译，否则在外部接管下载和解压
          if "${{ steps.cache-boost.outputs.cache-hit }}"=="true" goto run_bat
          
          echo === 缓存未命中，开始在外部高速下载和解压 Boost ===
          
          :: 1. 强行创建符合小狼毫预期的物理目录结构
          if not exist "%GITHUB_WORKSPACE%\deps" mkdir "%GITHUB_WORKSPACE%\deps"
          cd "%GITHUB_WORKSPACE%\deps"
          
          :: 2. 使用系统原生的 curl 从 GitHub 骨干网高速下载官方 CMake 版的 Boost 压缩包
          curl -L -o boost_1_78_0.zip https://github.com
          
          :: 3. 使用原生 PowerShell 强制解压，绝不产生路径歧义
          powershell -Command "Expand-Archive -Path boost_1_78_0.zip -DestinationPath . -Force"
          
          :: 4. 目录校准：确保解压出来的文件夹名字绝对是小狼毫强校验的 boost_1_78_0
          if exist "boost_1_78_0_cmake" move "boost_1_78_0_cmake" "boost_1_78_0"
          if exist "boost_1.78.0" move "boost_1.78.0" "boost_1_78_0"
          
          :: 5. 安全清理压缩包
          del boost_1_78_0.zip
          
          echo === 验证：确保 %BOOST_ROOT%\boost 目录物理就绪 ===
          dir "%GITHUB_WORKSPACE%\deps\boost_1_78_0\boost"

          :run_bat
          :: 回到工作流根目录，呼叫小狼毫的脚本（此时脚本内的 goto boost_found 会直接触发，完美绕过原先报错的 aria2 逻辑）
          cd "%GITHUB_WORKSPACE%"
          call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      # 🚀 1. Point directly to the Boost version pre-cached by GitHub on windows-latest
      BOOST_ROOT: C:\hostedtoolcache\windows\Boost\1.83.0\x64
      BOOST_LIBRARYDIR: C:\hostedtoolcache\windows\Boost\1.83.0\x64\lib
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: powershell
        run: |
          # 2. Duplicate the env file template
          if (Test-Path "env.vs2022.bat") {
              Copy-Item "env.vs2022.bat" -Destination "env.bat" -Force
              Write-Host "Copied env.vs2022.bat to env.bat"
          } else {
              Copy-Item "env.vs2019.bat" -Destination "env.bat" -Force
              Write-Host "Fallback: Copied env.vs2019.bat to env.bat"
          }

          # 3. Mount environment variables directly to the global GITHUB_ENV pipeline context
          "BOOST_ROOT=${{ env.BOOST_ROOT }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOST_LIBRARYDIR=${{ env.BOOST_LIBRARYDIR }}" | Out-File -FilePath $env:GITHUB_ENV -Append

          $git_ref_name = git describe --always
          "git_ref_name=$git_ref_name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Pre-installed Boost Presence
        shell: powershell
        run: |
          # 4. Verify that the file path actually contains the compiler header rules
          if (Test-Path "${{ env.BOOST_ROOT }}\boost\version.hpp") {
              Write-Host "Success: Pre-installed GitHub Boost detected safely!"
          } else {
              Write-Error "Error: Boost 1.83.0 was not found in the runner's toolcache folder."
          }

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          # 5. Overwrite env.bat parameters dynamically right before executing build hooks
          echo set BOOST_ROOT=%BOOST_ROOT% > env.bat
          echo set BOOST_LIBRARYDIR=%BOOST_LIBRARYDIR% >> env.bat
          .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          # 6. Apply identical file logic parameters for the core installer generation phase
          echo set BOOST_ROOT=%BOOST_ROOT% > env.bat
          echo set BOOST_LIBRARYDIR=%BOOST_LIBRARYDIR% >> env.bat
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

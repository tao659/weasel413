name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.83.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_83_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4  # 🚀 推荐升级到 v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        run: |
          # ✨ 核心修复：如果是 windows-latest (VS2022)，优先用 vs2022 的模板；否则退回 vs2019
          if (Test-Path "env.vs2022.bat") {
              copy env.vs2022.bat env.bat
          } else {
              copy env.vs2019.bat env.bat
          }
          
          # 🚨 核心修复：将你预设的云端 BOOST_ROOT 强行灌入 env.bat 末尾，防止被覆盖丢失
          echo set BOOST_ROOT=${{ env.BOOST_ROOT }} >> env.bat
          echo set BOOST_LIBRARYDIR=${{ env.BOOST_ROOT }}\stage\lib >> env.bat
          
          # 查看一下最终的 env.bat，确保路径正确
          type env.bat

          $git_ref_name = git describe --always
          echo "git_ref_name=$git_ref_name" >> $env:GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4  # 🚀 推荐升级到 v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: .\install_boost.bat

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4  # 🚀 推荐升级到 v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2 # 🚀 推荐升级到微软官方 v2，更完美支持 VS2022

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

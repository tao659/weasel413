name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest  # 🟢 修复1：升级到官方支持的最新 Windows 环境
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4  # 🟢 修复2：升级到 v4
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制环境基础配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 🟢 强行将工作流中的 BOOST_ROOT 写入 env.bat，防止被覆盖
          echo set BOOST_ROOT=%BOOST_ROOT%>>env.bat
          echo set boost_version=%boost_version%>>env.bat
          
          :: 3. 记录当前的 git 版本号
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          
          :: 打印一下 env.bat 的内容，方便在日志中对齐检查
          type env.bat


      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4  # 🟢 修复2：升级到 v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd # 🟢 修复3
        run: .\install_boost.bat


      - name: Check submodules
        shell: cmd # 🟢 修复3
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4  # 🟢 修复2：升级到 v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2 # 🟢 升级 msbuild 插件以适配新系统环境

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd # 🟢 修复3
        run: .\build.bat opencc

      - name: Copy Rime files
        shell: cmd # 🟢 修复3
        run: .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd # 🟢 修复3
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4  # 🟢 修复4：彻底解决此报错，升级到 v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe

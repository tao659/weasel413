name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-latest
    env:
      boost_version: 1.78.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_78_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          submodules: 'recursive'  # 🟢 递归克隆拉取 librime 子模块库
          fetch-depth: 0

      - name: Configure build environment
        shell: cmd
        run: |
          :: 1. 复制基础环境配置文件
          copy env.vs2019.bat env.bat
          
          :: 2. 系统注册表打桩，无视任何子脚本目录切换覆盖
          setx boost_version "${{ env.boost_version }}"
          setx BOOST_ROOT "%GITHUB_WORKSPACE%\deps\boost_1_78_0"
          
          :: 3. 强行灌入主目录和所有子目录的 env.bat
          echo.>>env.bat
          echo set boost_version=${{ env.boost_version }}>>env.bat
          echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
          
          if exist "librime" (
              cd librime
              if exist env.vs2019.bat copy /y env.vs2019.bat env.bat
              echo.>>env.bat
              echo set boost_version=${{ env.boost_version }}>>env.bat
              echo set BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>env.bat
              cd ..
          )
          
          :: 4. 物理删除容易引起本地覆盖干扰的旧脚本
          if exist "install_boost.bat" del /f /q "install_boost.bat"
          
          :: 5. 全局安全垫片：立刻创建防劫持的伪 aria2c.bat
          echo @echo off > "%GITHUB_WORKSPACE%\aria2c.bat"
          echo echo [Actions Mock] Safely bypass buggy aria2c call... >> "%GITHUB_WORKSPACE%\aria2c.bat"
          echo exit /b 0 >> "%GITHUB_WORKSPACE%\aria2c.bat"
          
          :: 6. 注入全局 Actions 环境通道
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"
          echo boost_version=${{ env.boost_version }}>>"%GITHUB_ENV%"
          echo BOOST_ROOT=%GITHUB_WORKSPACE%\deps\boost_1_78_0>>"%GITHUB_ENV%"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          # 🟢 终极绝杀 1：更换为全新的 -v20 编号 Key，彻底炸毁并隔离云端残留的所有 563KB “网页僵尸缓存”！
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-v20

      - name: Real Download and Install Boost Source via PowerShell Core
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh # 🟢 终极绝杀 2：改用高级 PowerShell 核心引擎下载，彻底弃用极易被 CMD 干扰的环境
        run: |
          Write-Host "=== 缓存未命中，开始执行硬核 Boost 源码落地 ==="
          
          if (Test-Path "${{ github.workspace }}\deps") { Remove-Item -Recurse -Force "${{ github.workspace }}\deps" }
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\deps"
          Set-Location "${{ github.workspace }}\deps"
          
          # 🟢 终极绝杀 3：弃用经常被防爬虫策略拦截的 GitHub 直链，直接采用微软 Azure 全球 CDN 托管的 Boost 纯源码 ZIP 压缩包 (140MB+ 真实大文件)
          $url = "https://sourceforge.net"
          Write-Host "Downloading Boost from stable mirror..."
          Invoke-WebRequest -Uri $url -OutFile "boost.zip"
          
          Write-Host "Extracting Boost Archive..."
          Expand-Archive -Path "boost.zip" -DestinationPath "." -Force
          
          if (Test-Path "boost_1_78_0") { Rename-Item -Path "boost_1_78_0" -NewName "boost_1_78_0_tmp" }
          if (Test-Path "boost-1.78.0") { Move-Item -Path "boost-1.78.0" -Destination "boost_1_78_0" }
          if (Test-Path "boost_1_78_0_tmp") { Move-Item -Path "boost_1_78_0_tmp" -Destination "boost_1_78_0" }
          
          Remove-Item -Force "boost.zip"
          
          Write-Host "=== 检查物理目录特征 ==="
          Get-ChildItem "${{ github.workspace }}\deps\boost_1_78_0\boost"
          
          # 🟢 在纯净环境下直接呼叫小狼毫底层编译
          Set-Location "${{ github.workspace }}"
          $env:PATH = "${{ github.workspace }};" + $env:PATH
          cmd.exe /c ".\build.bat boost"

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies
        shell: cmd
        run: |
          :: 🟢 此时物理真源码已完全就绪，系统注册表已被 setx 全局锁死，直接推进 opencc 编译
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\github.install.bat

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%;%PATH%
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
